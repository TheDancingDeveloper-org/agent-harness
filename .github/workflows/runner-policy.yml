# Organization runner policy gate. All logic lives in the reusable workflow in
# github-policy so the rule changes in one place. Make `runner-policy` a
# required status check on main, or this reports without blocking.
name: Runner policy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  runner-policy:
    uses: TheDancingDeveloper-org/github-policy/.github/workflows/runner-policy-reusable.yml@main
