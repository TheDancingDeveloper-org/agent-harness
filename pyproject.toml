[project]
name = "agent-harness"
version = "0.0.0"
description = "Service-hosted, GUI-driven harness for role-routed coding-agent fleets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
agent-harness = "agent_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Illustrative snippets in the plan are prose, not code to be formatted.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
