[project]
name = "agent-harness"
version = "0.0.0"
description = "Service-hosted, GUI-driven harness for role-routed coding-agent fleets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Used by `run` for the model transport. It was declared only under the
    # dev extra, so a production install had no HTTP client and failed at the
    # first model call -- long after install, in the one command that matters.
    "httpx>=0.27",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    # Starlette's TestClient needs a specific HTTP client, and which one
    # changed: older releases wanted `httpx`, current ones want `httpx2`.
    # Pinned rather than left open because a mismatch fails during fixture
    # setup, before any endpoint is exercised, with an error naming the wrong
    # package. tests/conftest.py turns that into one legible message.
    "httpx2>=2.9",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
agent-harness = "agent_harness.__main__:main"

# Route presets, resolved by name at runtime. Declared as metadata rather than
# imported, so core never depends on an adapter and a build that names none
# loads none. Any distribution may add to this group; that is how a vendor is
# added without editing `model_client.py`.
[project.entry-points."agent_harness.route_presets"]
chat-completions = "agent_harness.adapters.chat_completions:PRESET"
claw-bay = "agent_harness.adapters.claw_bay:PRESET"

# Dependency resolvers, on the same terms. A `depends on:
# external:NAME:IDENTITY` token names one of these; `graph.py` reads the
# metadata and imports only the adapter that name belongs to. Core never
# learns an external tracker's format.
[project.entry-points."agent_harness.dependency_resolvers"]
github-issue = "agent_harness.adapters.github_issue:resolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Illustrative snippets in the plan are prose, not code to be formatted.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids calls in argument defaults. FastAPI's dependency injection IS
# that pattern, and the alternative (Annotated[...]) does not resolve under
# `from __future__ import annotations` for closure-scoped dependencies.
"src/agent_harness/api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
# Pydantic models drive the OpenAPI schema; without its plugin mypy cannot see
# which fields have defaults and reports every construction as missing args.
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
strict = true

# The OpenTelemetry SDK is an OPTIONAL dependency of one adapter and is
# deliberately not installed: "the harness runs identically without it" is a
# property the whole test suite asserts by running without it. mypy would
# otherwise fail on the imports inside the `try` that exists precisely because
# the package may be absent.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
